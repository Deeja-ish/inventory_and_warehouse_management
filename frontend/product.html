<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
</head>

<body>
    <header class="app-title">
        <h2 class="main-title">Product page</h2>
        <p class="title-description"> View and search for your companies different products here</p>
    </header>
    <div class="product_navigate">
        <input type='search' id="search_product">
        <button id="add_product">Add Product</button>
        <form id="add_product_form" , class="add_product_from" style="display: none;">
            <div class="input-section">
                <label for="product_name">Product Name:</label>
                <input type="text" name='product_name' required>
            </div>
            <div class="input-section">
                <label for="category">Category</label>
                <select name="category" id="category"></select>
            </div>
            <div class="input-section">
                <label for="sku">Sku:</label>
                <input type="text" name="sku" id="sku" required>
            </div>
            <div class="input-section">
                <label for="product-type">Product Type:</label>
                <select name="product_type" id="product_type"></select>
            </div>
            <div class="input-section">
                <label for="unit_type">Unit Type</label>
                <select name="unit_type" id="unit_type"></select>
            </div>
            <div class="input-select">
                <label for="unit_of_measure">Unit of measure</label>
                <input type="text" name="unit_of_measure" id="unit_of_measure">
            </div>
            <div class="input-select">
                <label for="product_description"></label>
                
            </div>
        </form>
        <main class="main-content"></main>
    </div>
    <main class="main_content"></main>
</body>

</html>
