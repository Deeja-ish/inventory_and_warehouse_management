<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Staff | StockWise Inventory</title>
    <meta name="description" content="Create your staff account and join your company's StockWise workspace.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
<div class="auth-shell">
    <aside class="auth-aside">
        <a href="index.html" class="sidebar-brand p-0 text-white"><span class="brand-mark"><i class="bi bi-box-seam"></i></span>StockWise</a>
        <div>
            <h2 class="mb-4">Join your team's workspace.</h2>
            <div class="auth-feature"><i class="bi bi-people"></i><div><strong>Pick your company</strong><span>Your account is linked to your company's data only.</span></div></div>
            <div class="auth-feature"><i class="bi bi-person-badge"></i><div><strong>Start as staff</strong><span>A manager can upgrade your role at any time.</span></div></div>
        </div>
        <small class="text-white-50">&copy; StockWise Inventory</small>
    </aside>

    <div class="auth-panel">
        <main class="main-container auth-card wide">
            <header class="title mb-4">
                <h1 class="title-header auth-title">Create your account</h1>
                <p class="title-head auth-subtitle mb-0">Register yourself to your company's workspace.</p>
            </header>

            <form action="post" id="register_form" class="form">
                <div class="row g-3">
                    <div class="col-12 input-section">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="deeja_goni" required>
                    </div>
                    <div class="col-md-6 input-section">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Khadija" required>
                    </div>
                    <div class="col-md-6 input-section">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Goni" required>
                    </div>
                    <div class="col-12 input-section">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="khadijagoni@gmail.com" required>
                    </div>
                    <div class="col-md-7 input-section">
                        <label for="company" class="form-label">Company</label>
                        <select name="company" id="company" class="form-select"></select>
                    </div>
                    <div class="col-md-5 input-section">
                        <label for="role" class="form-label">Role</label>
                        <select name="role" id="role" class="form-select">
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                    <div class="col-md-6 input-section">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-md-6 input-section">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-4">Register</button>
            </form>

            <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
        </main>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
