<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header class="title">
        <h2 class="title-header">Registration Page</h2>
        <p class="title-head">Create Your Company Account</p>
    </header>
    <main class="main-container">
        <form action="post" id="register_form" class="form">
            <div class="input-section">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="deeja_goni" required>
            </div>
            <div class="input-section">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" placeholder="khadija" required>
            </div>
            <div class="input-section">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" placeholder="goni" required>
            </div>
            <div class="input-section">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="khadijagoni@gmail.com" required>
            </div>
            <div class="input-section">
                <label for="company">Company:</label>
                <select name="company" id="company">
                </select>
            </div>
            <div class="input-section">
                <label for="role">Role:</label>
                <select name="role" id="role">
                    <option value="Staff">Staff</option>
                </select>
            </div>
            <div class="input-section">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-section">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit">Register User</button>
        </form>
    </main>
</body>
<script src="js/register.js"></script>

</html>
